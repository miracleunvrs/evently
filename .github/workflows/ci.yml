name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evently
          POSTGRES_PASSWORD: evently
          POSTGRES_DB: evently
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evently"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: backend
      - run: sudo apt-get update && sudo apt-get install -y libsodium23
      - run: bundle exec rails db:prepare
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://evently:evently@127.0.0.1:5432/evently
          JWT_SECRET: test-secret
          RAILS_ENV: test
      - run: bundle exec rails test && bundle exec rubocop && bundle exec rails zeitwerk:check && bundle exec brakeman -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://evently:evently@127.0.0.1:5432/evently
          JWT_SECRET: test-secret
          RAILS_ENV: test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run install:ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
