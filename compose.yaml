# Evently prod-parity (docker-ci skill). web (Vinext PWA) + api (FastAPI) + db (Postgres).
# Цель SPEC §5: browser → nginx (:80/443) → api (:8000) → db (:5432). nginx — следующим шагом.
services:
  web:
    build: .
    ports:
      - "${PORT:-8080}:5173"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/srv # живой код без пересборки (зависимости — из образа)
    environment:
      DATABASE_URL: postgresql+psycopg://evently:evently@db:5432/evently
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: evently-db
    environment:
      POSTGRES_USER: evently
      POSTGRES_PASSWORD: evently
      POSTGRES_DB: evently
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evently"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
